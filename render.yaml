services:
  - type: web
    name: market-pulse-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        value: https://market-pulse-ai.pages.dev
      - key: PENNY_OPPORTUNITY_SCHEDULER_ENABLED
        value: true
      - key: PENNY_OPPORTUNITY_MARKET
        value: TH
      - key: PENNY_OPPORTUNITY_MAX_PRICE
        value: "10"
      - key: PENNY_OPPORTUNITY_LIMIT
        value: "5"
      - key: PENNY_OPPORTUNITY_SCHEDULE_MINUTES
        value: "60"
      - key: PENNY_OPPORTUNITY_INITIAL_DELAY_SECONDS
        value: "30"
